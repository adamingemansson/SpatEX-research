[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatex-research"
version = "0.1.0"
description = "Experimental research implementation for SpatEX"
requires-python = ">=3.11"
dependencies = [
  "anndata>=0.10",
  "h5py>=3.10",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "torch>=2.2",
]

[project.optional-dependencies]
train = ["matplotlib>=3.8", "tensorboard>=2.17"]
test = ["pytest>=8.0"]

[project.scripts]
spatex-prepare = "spatex.prepare_data:main"
spatex-fit-structure = "spatex.structure:main"
spatex-train = "spatex.train:main"
spatex-launch = "spatex.launch:main"
spatex-evaluate = "spatex.evaluate:main"
spatex-predict = "spatex.infer:main"
spatex-fit-panels = "spatex.panels:main"
spatex-study = "spatex.study:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
